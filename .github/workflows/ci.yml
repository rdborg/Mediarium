# Runs on every push to main and on every pull request.
#
# Besides building and testing, it keeps the documentation honest:
#   * the reference pages in docs/reference are generated from the code, and the
#     build fails if they are out of date (run `go run ./tools/docgen`)
#   * the list of sentences the server sends, which the web app translates
#     (web/src/serverText.json), is generated too (run `go run ./tools/msgextract`)
#   * THIRD_PARTY_NOTICES.md lists the licence of everything bundled, and the
#     build fails if it is out of date (run `go run ./tools/notices`)
#   * a pull request that changes the app but touches neither docs/ nor
#     CHANGELOG.md fails, unless it carries the "no-docs-needed" label

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test $(go list ./... | grep -v torrentclient)
      - name: Reference docs are up to date
        run: go run ./tools/docgen -check
      - name: The list of server sentences is up to date
        run: go run ./tools/msgextract -check

  # Bug patterns the compiler doesn't catch (staticcheck's SA checks).
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -checks "SA*,-SA1019" ./...

  # Every test again with the race detector, which catches two goroutines
  # touching the same data. It makes the tests about ten times slower, and the
  # api package alone is most of the suite, so the work is split over several
  # jobs that run side by side: one for every other package, and the api tests
  # in four shards (each shard runs every fourth test of the package).
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Tests with the race detector (all packages but api)
        run: go test -race -timeout 90m $(go list ./... | grep -v -e torrentclient -e '/internal/api$')

  race-api:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Tests of the api package with the race detector (one shard)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Test names are dealt out one by one, so the shards stay about the
          # same size as tests are added. -list also prints Example names and
          # a trailing "ok" line, which the pattern below keeps out.
          tests="$(go test -list '^Test' ./internal/api | grep '^Test' | awk -v s="$SHARD" 'NR % 4 == s' | paste -sd '|' -)"
          test -n "$tests"
          go test -race -timeout 90m -run "^($tests)\$" ./internal/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # The licence list covers the npm packages too, so it's checked here,
      # where they are installed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Third-party notices are up to date
        working-directory: .
        run: go run ./tools/notices -check

  # The app in a real browser: a fresh install through the setup wizard, then
  # every main page, demo mode, signing in, the theme and the language.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app and the server
        run: |
          cd web && npm ci && npm run build && cd ..
          go build -tags nodynamic -o "$RUNNER_TEMP/mediarium" ./cmd/app
      - name: Start Mediarium with an empty config folder
        run: |
          mkdir -p "$RUNNER_TEMP"/m/{config,movies,tv,downloads}
          CONFIG_DIR="$RUNNER_TEMP/m/config" MOVIES_DIR="$RUNNER_TEMP/m/movies" TV_DIR="$RUNNER_TEMP/m/tv" DOWNLOADS_DIR="$RUNNER_TEMP/m/downloads"             nohup "$RUNNER_TEMP/mediarium" > "$RUNNER_TEMP/mediarium.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8264/ >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/mediarium.log"; exit 1
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/mediarium.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  # Known security problems in the code we depend on. Kept as its own job so
  # a new advisory shows up clearly instead of hiding a build failure.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Go (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Web (npm audit, shipped packages only)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  docs-updated:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The documentation moved with the code
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          app="$(echo "$changed" | grep -E '^(internal|cmd|db|web/src)/' || true)"
          docs="$(echo "$changed" | grep -E '^(docs/|CHANGELOG.md|README.md)' || true)"
          if [ -n "$app" ] && [ -z "$docs" ]; then
            echo "This pull request changes the app but not the documentation."
            echo "Update the matching page in docs/ and add a line to CHANGELOG.md,"
            echo "or add the 'no-docs-needed' label if nothing user-visible changed."
            exit 1
          fi
