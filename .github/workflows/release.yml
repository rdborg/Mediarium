# Release pipeline: runs when a tag like v2.1.0 is pushed.
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# The VERSION file at the repository root is the single source of the version
# number (see docs/RELEASING.md). The first job fails the whole release when
# the pushed tag is not "v" + the contents of VERSION, so a release can never
# be published under a number the code does not carry.
#
# What it produces:
#   1. Native Linux binaries (linux/amd64, linux/arm64), each packed with
#      LICENSE + README-INSTALL.txt and the systemd files, plus a
#      sha256sums.txt and its signature sha256sums.txt.sig (when the
#      UPDATE_SIGNING_KEY secret is set), attached to a GitHub Release.
#   2. A multi-arch (linux/amd64 + linux/arm64) Docker image pushed to
#      ghcr.io/<owner>/<repo>, built from the repo's Dockerfile, and a second
#      "full" image (tags ending in -full, for example 2.1.3-full and
#      latest-full) that has the Cloudflare helper built in. The full image is
#      smoke-tested (both programs must answer) before it is pushed.
#
# Notes:
#   * There was no other workflow in .github/workflows/ when this was written,
#     so nothing here duplicates a CI job. If you add a CI workflow later, keep
#     it on push/pull_request so the two never both run on a tag.
#   * The frontend (web/dist) is embedded into the Go binary by web/embed.go
#     (//go:embed dist), so it MUST be built before `go build`. The `frontend`
#     job builds it once and the `binaries` matrix downloads it. The Docker
#     build does its own frontend stage inside the Dockerfile.
#   * -X variable names (main.version, main.defaultTMDBAPIKey,
#     main.defaultOpenSubtitlesAPIKey, main.defaultTraktClientID) are copied
#     from the Dockerfile and cmd/app/main.go. Keep all three in sync.
#   * Optional repository secrets TMDB_API_KEY, OPENSUBTITLES_API_KEY and
#     TRAKT_CLIENT_ID bake app-wide identifiers into official builds (see the
#     Dockerfile). If a secret is not set the value is empty and the app asks
#     each user for their own key, exactly like a build from source.
#   * NOT TESTED: this workflow has not been run on GitHub yet. The Go
#     cross-compile commands it uses were verified locally.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag matches VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major_minor: ${{ steps.v.outputs.major_minor }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read VERSION and compare with the tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d ' \r\n' < VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! echo "${version}" | grep -Eq "${semver}"; then
            echo "::error::VERSION holds '${version}', which is not a semantic version like 2.1.3 or 2.1.0-beta.1."
            exit 1
          fi
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::The tag is ${TAG} but VERSION says ${version}. Tag the commit as v${version}, or update VERSION and tag again."
            exit 1
          fi
          core="${version%%[-+]*}"
          major_minor="${core%.*}"
          prerelease=false
          case "${version}" in *-*) prerelease=true ;; esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (major.minor ${major_minor}, pre-release: ${prerelease})"

  frontend:
    name: Build frontend
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22 # the oldest Node the web build needs; the Dockerfile uses a newer one
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web/dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Replaces the tracked placeholder web/dist/index.html with the real UI
      # before go:embed picks it up.
      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-dist
          path: web/dist

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.version.outputs.version }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: |
          set -euo pipefail
          name="mediarium_${VERSION}_${GOOS}_${GOARCH}"
          out="dist/${name}"
          mkdir -p "${out}"

          exe="mediarium"

          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.defaultTMDBAPIKey=${TMDB_API_KEY} -X main.defaultOpenSubtitlesAPIKey=${OPENSUBTITLES_API_KEY} -X main.defaultTraktClientID=${TRAKT_CLIENT_ID}" \
            -o "${out}/${exe}" ./cmd/app

          cp LICENSE "${out}/LICENSE"
          cp packaging/README-INSTALL.txt "${out}/README-INSTALL.txt"
          mkdir -p "${out}/docs"
          cp docs/INSTALL.md "${out}/docs/INSTALL.md"

          # The systemd files for running it as a service (see packaging/README.md).
          cp packaging/systemd/mediarium.service "${out}/mediarium.service"
          cp packaging/systemd/mediarium.env.example "${out}/mediarium.env.example"

          cd dist
          tar -czf "${name}.tar.gz" "${name}"
          rm -rf "${name}"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: [version, binaries]
    runs-on: ubuntu-latest
    # The signing key belongs in the secrets of this environment (Settings >
    # Environments > release), which should only be open to protected v* tags.
    # See docs/RELEASING.md, "Protecting the signing key".
    environment: release
    permissions:
      contents: write # create the release and upload assets
    steps:
      # The repository is needed for the signing tool (tools/signsums) and for
      # the public key it must match (cmd/app/main.go).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt

      # Signs sha256sums.txt with the private key held in the repository secret
      # UPDATE_SIGNING_KEY (base64 of a 32-byte ed25519 seed; make a pair with
      # `go run ./tools/signsums -generate`). The app installs an update only if
      # this signature verifies against the public key built into it. Without the
      # secret the release is still published, just unsigned, and the app tells
      # people to update the way they installed it. The key is only ever in this
      # step's environment, never on a command line.
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::warning::The UPDATE_SIGNING_KEY secret is not set, so this release is NOT signed. Mediarium will not offer to install it from the Update now button."
            exit 0
          fi
          pub="$(sed -n 's/^var updatePublicKey = "\(.*\)"$/\1/p' cmd/app/main.go)"
          if [ -z "${pub}" ]; then
            echo "::error::Could not find updatePublicKey in cmd/app/main.go."
            exit 1
          fi
          go run ./tools/signsums -in release/sha256sums.txt -out release/sha256sums.txt.sig -expect-pub "${pub}"
          ls -l release/sha256sums.txt.sig

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A version with a hyphen (2.1.0-beta.1) is published as a pre-release.
          flags=""
          if [ "${PRERELEASE}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Mediarium ${TAG}" \
            --generate-notes \
            ${flags}

  docker:
    name: Docker image (ghcr.io)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The runtime stage runs `apk add` for the TARGET architecture, which
      # needs QEMU for the arm64 image even though Go itself cross-compiles.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags, taken from VERSION. For 2.1.3: 2.1.3, 2.1 and latest.
      # A pre-release (2.1.0-beta.1) gets only its own exact tag, so people
      # following 2.1 or latest are never moved onto a beta. The repository
      # name is lower-cased by the action, which ghcr.io requires.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- The "full" image (Cloudflare helper built in) ----
      # Tags get a -full ending: 2.1.3-full, 2.1-full and latest-full, with the
      # same pre-release rule as above.
      - name: Docker metadata (full)
        id: meta_full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-full
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major_minor }},enable=${{ needs.version.outputs.prerelease != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease != 'true' }}

      # Build for this runner (amd64) only, keep it local and prove it starts.
      - name: Build full image for a smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: full
          platforms: linux/amd64
          load: true
          tags: mediarium-full-smoke:test
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max

      - name: Smoke test the full image
        run: bash docker/smoke-full.sh mediarium-full-smoke:test

      - name: Build and push full image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,scope=full,mode=max
