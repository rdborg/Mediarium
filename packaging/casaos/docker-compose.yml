# Mediarium as a CasaOS / ZimaOS custom app.
# STATUS: UNTESTED (no CasaOS or ZimaOS install was available). The plain
# `services:` part is ordinary compose. The two `x-casaos` blocks are CasaOS
# display metadata written from memory of the CasaOS app-store format; if the
# importer complains, delete both x-casaos blocks and it should still install
# as a plain compose app (you just lose the pretty title/icon).
#
# How to use (labels from memory, may differ by version): open the CasaOS
# dashboard, go to App Store, use the "Custom Install" option (top right),
# choose to import a docker-compose file, paste this, and install.
#
# Folder note: CasaOS creates /DATA/Media, /DATA/Downloads etc. by default. Mediarium
# needs downloads and the library under ONE mount so imports can hardlink, so this
# file mounts /DATA/Media as /data and expects /DATA/Media/downloads, /DATA/Media/movies
# and /DATA/Media/tv. If you already have "Movies" / "TV Shows" folders there, change
# the three *_DIR variables below to match (the names are case sensitive on Linux).
#
# PUID/PGID: CasaOS's default user is usually uid 1000 / gid 1000, but check with
# `id` in the CasaOS terminal before relying on that.
#
# The image ghcr.io/rdborg/mediarium is not published yet (private repo).

name: mediarium
services:
  mediarium:
    image: ghcr.io/rdborg/mediarium:latest
    container_name: mediarium
    restart: unless-stopped
    ports:
      - target: 8264
        published: "8264"
        protocol: tcp
      # Optional: the torrent port. Torrents work without it, but with it other
      # peers can connect to you (more peers, proper seeding). Keep it the same
      # as Settings > Downloads & VPN > Listen port.
      - target: 58264
        published: "58264"
        protocol: tcp
      - target: 58264
        published: "58264"
        protocol: udp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DOWNLOADS_DIR=/data/downloads
      - MOVIES_DIR=/data/movies
      - TV_DIR=/data/tv
    volumes:
      - type: bind
        source: /DATA/AppData/mediarium/config
        target: /config
      - type: bind
        source: /DATA/Media
        target: /data
    x-casaos:
      ports:
        - container: "8264"
          description:
            en_us: Web interface
        - container: "58264"
          description:
            en_us: Torrent port, TCP and UDP (optional, more peers and better seeding)
      volumes:
        - container: /config
          description:
            en_us: Mediarium database and encryption key. Back this up.
        - container: /data
          description:
            en_us: Parent folder holding downloads, movies and tv (keep them together for hardlinks).
      envs:
        - container: PUID
          description:
            en_us: User ID that owns your media files
        - container: PGID
          description:
            en_us: Group ID that owns your media files
        - container: TZ
          description:
            en_us: Timezone, for example Europe/Malta

x-casaos:
  architectures:
    - amd64
    - arm64
  main: mediarium
  category: Media
  author: Mediarium contributors
  developer: Mediarium contributors
  title:
    en_us: Mediarium
  tagline:
    en_us: Movies and TV, search to library in one app
  description:
    en_us: Self-hosted media manager combining Radarr, Sonarr, Prowlarr, SABnzbd and Bazarr style features in one container.
  index: /
  port_map: "8264"
  # icon: set to a hosted PNG URL once the repo is public
  # (branding/mediarium-icon-512.png in the repo).
