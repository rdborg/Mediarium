<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediarium</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <!-- Loading screen shown before the app's code arrives (same look as components/Splash.tsx). -->
    <style>
      .splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; background: #0f1216; color: #e8ecf1; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 100; }
      .splash-mark { width: 112px; height: 112px; border-radius: 30px; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(45, 212, 191, 0.22), rgba(45, 212, 191, 0.04) 70%); animation: splash-breathe 2.2s ease-in-out infinite; }
      .splash-logo { width: 64px; height: 64px; color: #2dd4bf; }
      .splash-name { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
      .splash-label { color: #8b95a3; font-size: 0.95rem; }
      .splash-dots i { font-style: normal; animation: splash-dot 1.2s infinite; opacity: 0.2; }
      .splash-dots i:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.18); } 50% { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(45, 212, 191, 0); } }
      @keyframes splash-dot { 0%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
      @media (prefers-color-scheme: light) { .splash { background: #f6f7f9; color: #1b2330; } .splash-logo { color: #0f9f8f; } }
      @media (prefers-reduced-motion: reduce) { .splash-mark, .splash-dots i { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-mark">
          <svg class="splash-logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 28V15a11 11 0 0 1 22 0v13h-6l-5-11-5 11z" fill="currentColor" /></svg>
        </div>
        <div class="splash-name">Mediarium</div>
        <div class="splash-label">Loading<span class="splash-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
