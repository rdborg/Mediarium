# Runs on every push to main and on every pull request.
#
# Besides building and testing, it keeps the documentation honest:
#   * the reference pages in docs/reference are generated from the code, and the
#     build fails if they are out of date (run `go run ./tools/docgen`)
#   * a pull request that changes the app but touches neither docs/ nor
#     CHANGELOG.md fails, unless it carries the "no-docs-needed" label

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test $(go list ./... | grep -v torrentclient)
      - name: Reference docs are up to date
        run: go run ./tools/docgen -check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docs-updated:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The documentation moved with the code
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          app="$(echo "$changed" | grep -E '^(internal|cmd|db|web/src)/' || true)"
          docs="$(echo "$changed" | grep -E '^(docs/|CHANGELOG.md|README.md)' || true)"
          if [ -n "$app" ] && [ -z "$docs" ]; then
            echo "This pull request changes the app but not the documentation."
            echo "Update the matching page in docs/ and add a line to CHANGELOG.md,"
            echo "or add the 'no-docs-needed' label if nothing user-visible changed."
            exit 1
          fi
