# Rebuilds the "full" image (the one with the Cloudflare helper) every week from
# the latest release, so security fixes for the browser and the operating system
# underneath it reach people without waiting for a new Mediarium version. The
# app itself is the same code as the release; only the layers below it are fresh.
# Runs nothing until the first release exists.

name: Rebuild full image

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-full
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild the -full image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Find the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "${tag}" ]; then
            echo "There is no release yet, nothing to rebuild."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          core="${version%%[-+]*}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${core%.*}" >> "$GITHUB_OUTPUT"
          # ghcr.io only accepts lower-case names.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.latest.outputs.found == 'true'
        with:
          ref: ${{ steps.latest.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: steps.latest.outputs.found == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.latest.outputs.found == 'true'

      - name: Log in to ghcr.io
        if: steps.latest.outputs.found == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for a smoke test
        if: steps.latest.outputs.found == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: full
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true
          tags: mediarium-full-smoke:test
          build-args: |
            VERSION=${{ steps.latest.outputs.version }}

      - name: Smoke test
        if: steps.latest.outputs.found == 'true'
        run: bash docker/smoke-full.sh mediarium-full-smoke:test

      # Only a stable release is refreshed under latest-full and the short
      # version; a pre-release only refreshes its own exact tag.
      - name: Build and push
        if: steps.latest.outputs.found == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: full
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ${{ steps.latest.outputs.image }}:${{ steps.latest.outputs.version }}-full
            ${{ !contains(steps.latest.outputs.version, '-') && format('{0}:{1}-full', steps.latest.outputs.image, steps.latest.outputs.major_minor) || '' }}
            ${{ !contains(steps.latest.outputs.version, '-') && format('{0}:latest-full', steps.latest.outputs.image) || '' }}
          build-args: |
            VERSION=${{ steps.latest.outputs.version }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }}
            TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
